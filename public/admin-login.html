<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Administrador - UniReserva</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-content">
      <div class="hero-brand">
        <h1>UniReserva</h1>
        <p>Sistema de Reserva de Salas Universitárias</p>
      </div>
    </div>
    <div class="hero-actions">
      <button id="theme-toggle" class="theme-toggle" aria-label="Alternar tema">
        <span class="theme-icon"></span>
      </button>
    </div>
  </header>

  <main class="container">
    <section class="card login-card login-admin">
      <a href="index.html" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-arrow-right" data-fg-djkv51="1.47:1.9237:/src/app/components/LoginPage.tsx:139:17:6301:45:e:ArrowRight::::::s5N" data-fgid-djkv51=":r1c:"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg> 
        Voltar</a>
      
      <div class="login-header">
        <div class="container-icons">
          <svg xmlns="http://www.w3.org/2000/svg" width="54" height="35" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shield w-8 h-8 text-primary" data-fg-djkv25="1.47:1.9237:/src/app/components/LoginPage.tsx:81:21:3386:43:e:Shield::::::B8zf" data-fgid-djkv25=":rr:">
            <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path></svg>
        </div>
        <div>
          <h2>Administrador</h2>
          <p class="login-subtitle">Faça login para continuar</p>
        </div>
      </div>

      <form id="login-form">
        <label for="email">Email</label>
        <input class="container-form" id="email" name="email" type="email" placeholder="seu@email.com" required />

        <label for="password">Senha</label>
        <input class="container-form" id="password" name="password" type="password" placeholder="••••••••" required />

        <button type="submit" class="btn-login btn-admin">Entrar</button>
      </form>
      <p id="login-status" class="status"></p>
    </section>
  </main>

  <script src="theme.js"></script>
  <script src="admin-login.js"></script>
</body>
</html>
